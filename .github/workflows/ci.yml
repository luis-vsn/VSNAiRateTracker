name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --no-restore -c Release

    - name: Run unit tests
      run: dotnet test --no-build -c Release --verbosity normal

    - name: Install Inno Setup (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        choco install innosetup --no-progress -y

    - name: Build Windows Installer & Portable Package
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        ./packaging/windows/build-installer.ps1 -Version 0.0.1

    - name: Upload Windows Installer
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v6
      with:
        name: windows-installer
        path: packaging/dist/*Setup*.exe

    - name: Upload Windows Portable Package
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v6
      with:
        name: windows-portable
        path: packaging/dist/*portable*.zip

    - name: Build macOS DMGs (Apple Silicon & Intel)
      if: matrix.os == 'macos-latest'
      run: |
        chmod +x ./packaging/macos/build-dmg.sh
        ./packaging/macos/build-dmg.sh Release 0.0.1 osx-arm64
        ./packaging/macos/build-dmg.sh Release 0.0.1 osx-x64

    - name: Upload macOS DMG (Apple Silicon)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v6
      with:
        name: macos-dmg-arm64
        path: packaging/dist/*-osx-arm64.dmg

    - name: Upload macOS DMG (Intel)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v6
      with:
        name: macos-dmg-x64
        path: packaging/dist/*-osx-x64.dmg

