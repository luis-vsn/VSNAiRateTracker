name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  # Manual run: Actions > CI > "Run workflow". Tick the box to also build/test/package on macOS.
  workflow_dispatch:
    inputs:
      include_macos:
        description: "Also build, test and package on macOS"
        type: boolean
        default: false

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is opt-in (manual run only) until the app is validated on that platform,
        # so pushes and pull requests are no longer marked as failed by the macOS job.
        os: ${{ fromJSON(inputs.include_macos && '["windows-latest","ubuntu-latest","macos-latest"]' || '["windows-latest","ubuntu-latest"]') }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        # Full history and tags, needed to derive the version from the latest tag.
        fetch-depth: 0

    # Version = MAJOR.MINOR.PATCH.BUILD
    #   MAJOR.MINOR.PATCH: the pushed tag (vX.Y.Z) or, for untagged commits, the latest vX.Y.Z tag.
    #   BUILD: github.run_number (always incremental for this workflow).
    - name: Compute version
      shell: bash
      run: |
        if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
          tag="$GITHUB_REF_NAME"
        else
          tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)"
        fi
        base="${tag#v}"
        if ! [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Tag '$tag' does not follow the vMAJOR.MINOR.PATCH format"
          exit 1
        fi
        version="$base.${{ github.run_number }}"
        echo "APP_VERSION=$version" >> "$GITHUB_ENV"
        echo "Resolved version: $version (from tag $tag)"

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --no-restore -c Release -p:Version=${{ env.APP_VERSION }}

    - name: Run unit tests
      run: dotnet test --no-build -c Release --verbosity normal

    - name: Install Inno Setup (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        choco install innosetup --no-progress -y

    - name: Build Windows Installer & Portable Package
      if: matrix.os == 'windows-latest'
      shell: pwsh
      env:
        OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT || secrets.TELEMETRY_ENDPOINT }}
        OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS || secrets.TELEMETRY_HEADERS }}
      run: |
        ./packaging/windows/build-installer.ps1 -Version ${{ env.APP_VERSION }}

    - name: Upload Windows Installer
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v7
      with:
        name: windows-installer
        path: packaging/dist/*Setup*.exe
        # Upload the file as-is (no zip wrapper). The artifact is named after the file.
        archive: false

    - name: Upload Windows Portable Package
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v7
      with:
        name: windows-portable
        path: packaging/dist/*portable*.zip
        # Upload the file as-is (no zip wrapper). The artifact is named after the file.
        archive: false

    - name: Build macOS DMGs (Apple Silicon & Intel)
      if: matrix.os == 'macos-latest'
      env:
        OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT || secrets.TELEMETRY_ENDPOINT }}
        OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS || secrets.TELEMETRY_HEADERS }}
      run: |
        chmod +x ./packaging/macos/build-dmg.sh
        ./packaging/macos/build-dmg.sh Release "$APP_VERSION" osx-arm64
        ./packaging/macos/build-dmg.sh Release "$APP_VERSION" osx-x64

    - name: Upload macOS DMG (Apple Silicon)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v7
      with:
        name: macos-dmg-arm64
        path: packaging/dist/*-osx-arm64.dmg
        # Upload the file as-is (no zip wrapper). The artifact is named after the file.
        archive: false

    - name: Upload macOS DMG (Intel)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v7
      with:
        name: macos-dmg-x64
        path: packaging/dist/*-osx-x64.dmg
        # Upload the file as-is (no zip wrapper). The artifact is named after the file.
        archive: false

  # Create a GitHub Release with direct-download assets when a version tag (v*) is pushed.
  # Files attached to a Release are downloaded as-is (no extra zip wrapping).
  release:
    name: Create Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
        merge-multiple: true

    - name: List release files
      run: ls -la artifacts

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: artifacts/*
