name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --no-restore -c Release

    - name: Run unit tests
      run: dotnet test --no-build -c Release --verbosity normal

    - name: Install Inno Setup (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        choco install innosetup --no-progress -y

    - name: Build Windows Installer & Portable Package
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        ./packaging/windows/build-installer.ps1

    - name: Upload Windows Artifacts
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: windows-installer-and-portable
        path: packaging/dist/*

    - name: Build macOS DMG (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        chmod +x ./packaging/macos/build-dmg.sh
        ./packaging/macos/build-dmg.sh Release 1.0.0 osx-arm64

    - name: Upload macOS Artifacts
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: macos-dmg
        path: packaging/dist/*.dmg

