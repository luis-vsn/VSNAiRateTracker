name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Manual run: Actions > CI > "Run workflow". Tick the box to also build/test/package on macOS.
  workflow_dispatch:
    inputs:
      include_macos:
        description: "Also build, test and package on macOS"
        type: boolean
        default: false

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is opt-in (manual run only) until the app is validated on that platform,
        # so pushes and pull requests are no longer marked as failed by the macOS job.
        os: ${{ fromJSON(inputs.include_macos && '["windows-latest","ubuntu-latest","macos-latest"]' || '["windows-latest","ubuntu-latest"]') }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --no-restore -c Release

    - name: Run unit tests
      run: dotnet test --no-build -c Release --verbosity normal

    - name: Install Inno Setup (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        choco install innosetup --no-progress -y

    - name: Build Windows Installer & Portable Package
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        ./packaging/windows/build-installer.ps1 -Version 0.0.1

    - name: Upload Windows Installer
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v6
      with:
        name: windows-installer
        path: packaging/dist/*Setup*.exe

    - name: Upload Windows Portable Package
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v6
      with:
        name: windows-portable
        path: packaging/dist/*portable*.zip

    - name: Build macOS DMG (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        chmod +x ./packaging/macos/build-dmg.sh
        ./packaging/macos/build-dmg.sh Release 0.0.1 osx-arm64

    - name: Upload macOS Artifacts
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v6
      with:
        name: macos-dmg
        path: packaging/dist/*.dmg

